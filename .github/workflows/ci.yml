name: ci

on:
  push:
    branches: [claude/stream-deck-developers-tqy1gj, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Unit tests are zero-dependency by design — no npm install.
      # Prompt/sanitizer/shape tests import lib/coach-shape.js only (not
      # lib/agent.js / ai). Do not add framework packages (e.g. @mastra/*) here.
      - run: npm test
      # Value-based leak check (Cipher L1): the real key must not be anywhere in
      # the tree. Skips when the secret is unavailable (e.g. fork PRs); the value
      # is passed via env/stdin only and never echoed.
      - name: HABIT_KEY value scan
        env:
          HABIT_KEY: ${{ secrets.HABIT_KEY }}
        run: |
          if [ -z "$HABIT_KEY" ]; then echo "HABIT_KEY secret not available; value scan skipped."; exit 0; fi
          if printf '%s\n' "$HABIT_KEY" | git grep -q -F -f - -- . ; then
            echo "::error::The HABIT_KEY value is committed in the tree (git grep)."; exit 1
          fi
          node tools/scan-value.mjs
      - name: Syntax-check all source
        run: |
          set -e
          for f in $(git ls-files '*.js' '*.mjs'); do
            node --check "$f"
          done

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i playwright-core @elgato/streamdeck esbuild --no-save
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
