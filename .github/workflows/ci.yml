name: ci

on:
  push:
    branches: [claude/stream-deck-developers-tqy1gj, main]
  pull_request:
  # Value scan also on a quiet weekly beat so a missed push still catches a
  # committed secret (#115). Pattern (non-value) checks stay on every PR.
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC

permissions:
  contents: read

jobs:
  unit:
    # Schedule is value-scan only; pattern checks already ran on every PR/push.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Recent runs finish in ~10s; 5m is comfortable headroom.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # v5+ can auto-cache when package.json has packageManager; keep
          # v4 behavior (no cache) — unit job never runs npm ci.
          package-manager-cache: false
      # Unit tests are zero-dependency by design — no npm install.
      # Prompt/sanitizer/shape tests import lib/coach-shape.js only (not
      # lib/agent.js / ai). Do not add framework packages (e.g. @mastra/*) here.
      # Includes the pattern-based key scanner (no secret value required).
      - run: npm test
      - name: Syntax-check all source
        run: |
          set -e
          for f in $(git ls-files '*.js' '*.mjs'); do
            node --check "$f"
          done

  # Value-based leak check (Cipher L1 / #115): the real HABIT_KEY must not be
  # anywhere in the tree. Runs only on push to the default branches and on the
  # weekly schedule — NEVER on pull_request. A crafted PR could replace
  # tools/scan-value.mjs (or the step script) and exfiltrate the secret when
  # GitHub injects it for same-repo PRs. Pattern checks above stay on PRs.
  habit-key-value-scan:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Recent runs finish in ~10s; 5m is comfortable headroom.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Neutralize v5+ automatic package-manager caching (see unit job).
          package-manager-cache: false
      - name: HABIT_KEY value scan
        env:
          HABIT_KEY: ${{ secrets.HABIT_KEY }}
        run: |
          if [ -z "$HABIT_KEY" ]; then echo "HABIT_KEY secret not available; value scan skipped."; exit 0; fi
          if printf '%s\n' "$HABIT_KEY" | git grep -q -F -f - -- . ; then
            echo "::error::The HABIT_KEY value is committed in the tree (git grep)."; exit 1
          fi
          node tools/scan-value.mjs

  e2e:
    # Schedule only needs the value scan; skip the longer e2e suite there.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Recent runs finish in ~1m (npm ci + Chromium + suite); 10m headroom.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Keep explicit no-auto-cache: e2e already uses npm ci; v5+ would
          # only auto-cache if package.json gained a packageManager field.
          package-manager-cache: false
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
