<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habit Tracker</title>
  <style>
    :root {
      --bg: #0b0c10; --card: #16181d; --line: #24272e; --fg: #e8eaed;
      --muted: #9aa0a6; --accent: #4f8cff; --good: #37c978;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f6f7f9; --card:#fff; --line:#e6e8eb; --fg:#1a1c1f; --muted:#6b7280; --accent:#2563eb; --good:#159a5a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .hnav { margin-bottom: 4px; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 64px; }
    header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
    h1 { font-size: 22px; margin:0; letter-spacing:-.01em; }
    .sub { color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
    .card .emoji { font-size:26px; line-height:1; }
    .card .name { color:var(--muted); font-size:13px; margin-top:8px; }
    .card .big { font-size:30px; font-weight:650; letter-spacing:-.02em; margin-top:2px; }
    .card .today { color:var(--good); font-size:12px; margin-top:4px; }
    section { margin-top:30px; }
    h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
    .chart { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 16px 10px; }
    .bars { display:flex; align-items:flex-end; gap:10px; height:150px; }
    .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
    .bar { width:100%; max-width:34px; background:var(--accent); border-radius:6px 6px 3px 3px; min-height:2px; transition:height .3s; }
    .bar-lbl { font-size:11px; color:var(--muted); }
    .bar-val { font-size:11px; color:var(--fg); }
    .recent { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    .row { display:flex; justify-content:space-between; padding:10px 16px; border-top:1px solid var(--line); font-size:14px; }
    .row:first-child { border-top:0; }
    .row .when { color:var(--muted); font-size:13px; }
    .setup { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
    .setup code { background:rgba(127,127,127,.16); padding:1px 6px; border-radius:6px; font-size:13px; }
    .setup ol { margin:10px 0 0; padding-left:20px; } .setup li { margin:6px 0; }
    .muted { color:var(--muted); } .empty { color:var(--muted); padding:24px 16px; text-align:center; }
    a { color:var(--accent); }
    .ai-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .ai-head h2 { margin:0; }
    .btn { border:0; border-radius:10px; padding:8px 14px; font:600 13px/1 inherit; cursor:pointer;
           background:linear-gradient(135deg,#8b5cf6,#6d28d9); color:#fff; }
    .btn:disabled { opacity:.55; cursor:default; }
    .slot-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
    .slot { border-radius:14px; padding:14px; border:1px solid var(--line);
            background:linear-gradient(160deg, rgba(139,92,246,.14), var(--card) 55%); }
    .slot.empty { border-style:dashed; background:var(--card); color:var(--muted);
                  display:flex; align-items:center; justify-content:center; min-height:96px; font-size:13px; }
    .slot .top { display:flex; align-items:center; gap:8px; }
    .slot .top .em { font-size:24px; }
    .slot .top .nm { font-weight:650; }
    .slot .why { font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.45; }
    .slot .tag { font-size:11px; color:#8b5cf6; font-weight:700; letter-spacing:.05em; margin-top:8px; }
    .ai-note { font-size:13px; color:var(--muted); margin-top:10px; }
    .ai-err { font-size:13px; color:#e05252; margin-top:10px; white-space:pre-wrap; }
    .gear { border:0; background:transparent; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 6px; }
    .settings { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:22px; display:none; }
    .settings.open { display:block; }
    .settings h3 { margin:0 0 12px; font-size:14px; }
    .settings label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
    .settings input, .settings textarea { width:100%; box-sizing:border-box; background:var(--bg); color:var(--fg);
      border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:14px; }
    .settings textarea { min-height:70px; resize:vertical; }
    .settings .row2 { display:flex; gap:10px; align-items:center; margin-top:14px; }
    .settings .status { font-size:12.5px; color:var(--muted); }
  </style>
</head>
<body>
  <script src="/nav.js" defer></script>
  <div class="wrap">
    <header>
      <div>
        <h1>Habit Tracker</h1>
        <div class="sub">Tap a Stream Deck key &rarr; it lands here. <span id="total" class="muted"></span></div>
      </div>
      <div class="sub" id="updated"></div>
    </header>
    <div class="settings" id="settings">
      <h3>Settings &amp; profile</h3>
      <label for="setName">Your name (the coach uses it)</label>
      <input id="setName" maxlength="60" placeholder="e.g. Shai" />
      <label for="setTz">Timezone (IANA name)</label>
      <input id="setTz" list="tzList" placeholder="America/New_York" />
      <datalist id="tzList"></datalist>
      <label for="setAbout">About you — anything the coach should know</label>
      <textarea id="setAbout" maxlength="1000" placeholder="Night owl. Desk job. Trying to drink more water and stop late-night snacking."></textarea>
      <div class="row2">
        <button class="btn" id="saveProfile">Save</button>
        <span class="status" id="profileStatus"></span>
      </div>
    </div>
    <div id="app"><div class="empty">Loading&hellip;</div></div>
  </div>

  <script>
    const EMOJI = { Pee:"🚽", Poop:"💩", Eat:"🍽", Drink:"💧", Exercise:"🏃" };
    const emojiFor = (h, e) => e || EMOJI[h] || "•";
    const app = document.getElementById('app');
    let slotState = null;   // latest /api/slots payload
    let lastEntries = [];   // latest /api/data entries
    let lastInsight = null; // latest coach daily digest

    const dayKey = (d) => { const x = new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
    const todayKey = dayKey(Date.now());
    const fmtTime = (t) => new Date(t).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });

    function render(entries) {
      if (!entries.length) {
        app.innerHTML = '<div class="empty">No taps yet. Tap a habit key on your Stream Deck &mdash; it&rsquo;ll show up here.</div><section id="ai"></section>';
        document.getElementById('total').textContent = '';
        renderAi();
        return;
      }
      // per-habit totals + today (+ last-seen emoji per habit, for AI habits)
      const totals = {}, today = {}, emap = {};
      for (const e of entries) {
        totals[e.h] = (totals[e.h]||0)+1;
        if (e.e) emap[e.h] = e.e;
        if (dayKey(e.t) === todayKey) today[e.h] = (today[e.h]||0)+1;
      }
      const habits = Object.keys(totals).sort((a,b)=>totals[b]-totals[a]);

      // last 7 days total volume
      const days = [];
      for (let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(dayKey(d)); }
      const perDay = Object.fromEntries(days.map(d=>[d,0]));
      for (const e of entries){ const k=dayKey(e.t); if(k in perDay) perDay[k]++; }
      const maxDay = Math.max(1, ...Object.values(perDay));

      const cards = habits.map(h => `
        <div class="card">
          <div class="emoji">${emojiFor(h, emap[h])}</div>
          <div class="big">${totals[h]}</div>
          <div class="name">${h}</div>
          ${today[h] ? `<div class="today">+${today[h]} today</div>` : `<div class="today muted">&mdash;</div>`}
        </div>`).join('');

      const bars = days.map(d => {
        const v = perDay[d];
        const dow = new Date(d+'T00:00').toLocaleDateString([], { weekday:'short' });
        return `<div class="bar-col">
          <div class="bar-val">${v||''}</div>
          <div class="bar" style="height:${Math.round((v/maxDay)*100)}%"></div>
          <div class="bar-lbl">${dow}</div>
        </div>`;
      }).join('');

      const recent = entries.slice(-12).reverse().map(e => `
        <div class="row"><span>${emojiFor(e.h, e.e)} ${e.h}${e.slot?` <span class="tag">AI</span>`:''}${e.note?` <span class="muted">(${e.note})</span>`:''}</span><span class="when">${fmtTime(e.t)}</span></div>`).join('');

      app.innerHTML = `
        <div class="grid">${cards}</div>
        <section><h2>Last 7 days</h2><div class="chart"><div class="bars">${bars}</div></div></section>
        <section id="ai"></section>
        <section><h2>Recent</h2><div class="recent">${recent}</div></section>`;
      document.getElementById('total').textContent = `${entries.length} total taps`;
      renderAi();
    }

    function renderAi() {
      const el = document.getElementById('ai');
      if (!el) return;
      const s = slotState;
      const btn = `<button class="btn" id="suggestBtn" ${s && !s.aiReady ? 'disabled' : ''}>✨ Suggest</button>`;
      const cards = (s?.slots || [null,null,null,null]).map((d, i) => d ? `
        <div class="slot">
          <div class="top"><span class="em">${d.emoji}</span><span class="nm">${d.label}</span></div>
          <div class="why">${(d.reason||'').replace(/</g,'&lt;')}</div>
          <div class="tag">SLOT ${i+1} · logs as ${d.habit}</div>
        </div>` : `
        <div class="slot empty">Slot ${i+1} — empty</div>`).join('');
      const note = s && !s.aiReady
        ? `<div class="ai-note">To enable: Vercel → project → Settings → Environment Variables → add <code>ZAI_API_KEY</code> (get one at z.ai) → redeploy.</div>`
        : `<div class="ai-note">The AI picks up to 4 extra habits it wants tracked, based on your taps. Slot keys on the Stream Deck log whatever is assigned here — and swap automatically when suggestions change.</div>`;
      const insight = lastInsight?.text
        ? `<div class="slot" style="margin-bottom:12px"><div class="top"><span class="em">📝</span><span class="nm">Coach's note · ${lastInsight.date||''}</span></div><div class="why">${String(lastInsight.text).replace(/</g,'&lt;')}</div></div>`
        : '';
      const tr = s?.track?.overall;
      const trackLine = tr && tr.offered > 0
        ? `<div class="ai-note" style="margin:0 0 10px">Track record: ${tr.landed}/${tr.offered} suggested keys tapped (${Math.round(tr.hitRate*100)}%) — the coach sees this and adapts.</div>`
        : '';
      el.innerHTML = `<div class="ai-head"><h2>AI Coach${s?.model ? ` <span class="muted" style="text-transform:none;letter-spacing:0">· ${s.model}</span>` : ''}</h2>${btn}</div>
        ${insight}${trackLine}<div class="slot-grid">${cards}</div>${note}<div class="ai-err" id="aiErr"></div>`;
      document.getElementById('suggestBtn')?.addEventListener('click', suggest);
    }

    async function suggest() {
      const btn = document.getElementById('suggestBtn'), err = document.getElementById('aiErr');
      btn.disabled = true; btn.textContent = '🤔 Thinking…'; err.textContent = '';
      try {
        const r = await fetch('/api/suggest', { method:'POST' });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || ('HTTP '+r.status));
        slotState = { ...slotState, slots: j.slots, model: j.model };
        renderAi();
      } catch (e2) {
        err.textContent = e2.message;
        btn.disabled = false; btn.textContent = '✨ Suggest';
      }
    }

    function renderSetup() {
      app.innerHTML = `<div class="setup">
        <strong>Almost there &mdash; storage isn&rsquo;t connected yet.</strong>
        <ol>
          <li>In Vercel, open this project &rarr; <strong>Storage</strong> tab.</li>
          <li>Create a database: <strong>Upstash for Redis</strong> (or <strong>KV</strong>), free tier is fine.</li>
          <li>Connect it to <code>stream-deck-habit-tracker</code>. Vercel adds the credentials automatically and redeploys.</li>
        </ol>
        <p class="muted">Once connected, taps to <code>/api/log?habit=Name</code> will appear here.</p>
      </div>`;
    }

    // Settings panel (opened from the nav bar, or /?settings=1 from other pages)
    const panel = document.getElementById('settings');
    try {
      document.getElementById('tzList').innerHTML =
        Intl.supportedValuesOf('timeZone').map(z=>`<option value="${z}">`).join('');
    } catch {}
    function toggleSettings(forceOpen) {
      const open = forceOpen === true ? true : !panel.classList.contains('open');
      panel.classList.toggle('open', open);
      if (open) {
        fetch('/api/profile').then(r=>r.json()).then(p => {
          document.getElementById('setName').value = p.name || '';
          document.getElementById('setTz').value = p.tz || p.effectiveTz || '';
          document.getElementById('setAbout').value = p.about || '';
          document.getElementById('profileStatus').textContent =
            p.effectiveTz ? `Coach currently reads your day as ${p.effectiveTz}` : '';
        }).catch(()=>{});
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
    window.addEventListener('toggle-settings', () => toggleSettings());
    if (new URLSearchParams(location.search).get('settings') === '1') toggleSettings(true);
    document.getElementById('saveProfile').addEventListener('click', () => {
      const st = document.getElementById('profileStatus');
      st.textContent = 'Saving…';
      fetch('/api/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('setName').value.trim(),
          tz: document.getElementById('setTz').value.trim(),
          about: document.getElementById('setAbout').value.trim()
        })
      }).then(r=>r.json()).then(j => {
        st.textContent = j.ok ? 'Saved — the coach will use this on its next pass.' : (j.error || 'Save failed');
      }).catch(e => { st.textContent = 'Save failed: ' + e.message; });
    });

    let firstLoad = true;
    function refresh() {
      Promise.all([
        fetch('/api/data').then(r=>r.json()),
        fetch('/api/slots?track=1').then(r=>r.json()).catch(()=>null)
      ]).then(([d, s]) => {
        slotState = s;
        lastInsight = d.insight || null;
        document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
        if (d.configured === false) return renderSetup();
        lastEntries = d.entries || [];
        render(lastEntries);
        firstLoad = false;
      }).catch(() => {
        if (firstLoad) app.innerHTML = '<div class="empty">Couldn&rsquo;t load data. Refresh to retry.</div>';
      });
    }
    refresh();
    // The coach repaints its keys in near real time — keep the page live too.
    setInterval(refresh, 20000);
  </script>
</body>
</html>
