<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual Stream Deck — Habit Tracker</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    /* Device geometry deliberately lives on :root, while theme.css declares the
       page TOKENS on <body> (so body[data-nav="dark"] can commit this page to
       night). The scope difference is the signal: these are measurements of a
       physical object, not palette. Sanctioned exception — design/WEB-UX.md §7. */
    :root {
      --key: 118px; --gap: 14px; --pad: 26px;
      --body1: #2a2c30; --body2: #131417; --bezel: #0b0c0e;
    }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      /* sanctioned: the studio vignette staging the product shot is part of the
         device illustration, not a page surface — design/WEB-UX.md §7 */
      background: radial-gradient(120% 100% at 50% 0%, #23262b 0%, #101216 55%, #0a0b0d 100%);
      color: var(--muted); padding: var(--s5) var(--s3); min-height: 100vh;
    }
    /* The title is a caption centered above the device, so the shared header
       flex/space-between pattern would fight the layout; the h1 and .sub type
       still come from theme.css and this only overrides what differs. */
    .top { margin-bottom: var(--s4); text-align: center; }
    .top h1 { font-size: 16px; font-weight: 600; letter-spacing: .02em; color: var(--ink2); }
    .top a { font-size: 13px; text-decoration: none; }   /* color: theme.css `a` → --accent */
    .top .sub { margin-top: var(--s1); }

    /* ---- the device: an illustration of hardware, not a UI surface.
       Every color, gradient, shadow and radius below is sanctioned to leave the
       token system (design/WEB-UX.md §7) — tokenizing it would let a palette
       edit deform the hardware. ---- */
    .device {
      position: relative;
      background: linear-gradient(160deg, var(--body1), var(--body2) 70%);
      border-radius: 30px;
      padding: var(--pad);
      box-shadow:
        0 2px 3px rgba(255,255,255,.06) inset,
        0 -3px 8px rgba(0,0,0,.55) inset,
        0 24px 50px rgba(0,0,0,.65),
        0 6px 16px rgba(0,0,0,.5);
    }
    /* faceplate bezel around keys, slightly recessed like the hardware */
    .face {
      background: linear-gradient(180deg, var(--bezel), #0e0f12);
      border-radius: 18px;
      padding: calc(var(--gap) + 4px);
      box-shadow: 0 1px 0 rgba(255,255,255,.04), 0 4px 14px rgba(0,0,0,.7) inset;
      display: grid;
      grid-template-columns: repeat(5, var(--key));
      grid-auto-rows: var(--key);
      gap: var(--gap);
    }
    .stand {
      width: 68%; height: 26px; margin: -4px auto 0;
      background: linear-gradient(180deg, #17181b, #060708);
      border-radius: 0 0 18px 18px;
      transform: perspective(300px) rotateX(38deg);
      transform-origin: top center;
      box-shadow: 0 18px 26px rgba(0,0,0,.6);
    }

    /* ---- keys ---- */
    .k {
      position: relative; width: var(--key); height: var(--key);
      border: 0; padding: 0; cursor: pointer; border-radius: 16px;
      background: #000; overflow: hidden; outline-offset: 3px;
      box-shadow:
        0 0 0 3px #050506,
        0 1px 0 rgba(255,255,255,.07),
        0 5px 10px rgba(0,0,0,.75);
      transition: transform .06s ease, filter .06s ease, box-shadow .06s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .k img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
    /* LCD glass: subtle top sheen over every lit key */
    .k .glass {
      position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
      background: linear-gradient(165deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 22%, rgba(255,255,255,0) 46%);
    }
    .k:active, .k.pressed {
      transform: translateY(2px) scale(.965);
      filter: brightness(.82);
      box-shadow: 0 0 0 3px #050506, 0 1px 3px rgba(0,0,0,.8);
    }
    .k.off { cursor: default; background: radial-gradient(circle at 50% 38%, #0c0d10, #050607 75%); }
    .k.off .glass { opacity: .5; }
    /* NOT part of the device exception: a focus ring is accessibility chrome and
       takes the shared accent (design/WEB-UX.md §7). The 3px offset above stays,
       so the ring clears the key well. */
    .k:focus-visible { outline: 2px solid var(--accent); }

    /* CSS-rendered faces (AI slots + fallbacks) — byte-parity mirrors of
       streamdeck-plugin/src/faces.mjs. Sanctioned exception (design/WEB-UX.md
       §7): the hues, halo formula, base gradient and urgency math must NOT
       become tokens, or a web-side theme edit silently desyncs the virtual deck
       from the hardware. The #fff ink mirrors the SVG faces' label fill. */
    .facecss {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px; padding-bottom: 10px;
      color: #fff; text-align: center;
    }
    .facecss .em { font-size: calc(var(--key) * .40); line-height: 1.15; filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
    .facecss .lb { font-size: calc(var(--key) * .13); font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.6); letter-spacing: .02em; }
    .facecss .badge { position: absolute; top: 6px; right: 8px; font-size: calc(var(--key) * .085); font-weight: 700; color: rgba(255,255,255,.85); }
    .slotface { background:
      radial-gradient(circle at 50% 36%, hsla(262,72%,58%,.62) 0%, hsla(262,72%,45%,.18) 42%, transparent 68%),
      linear-gradient(180deg,#141827,#0a0c13); }
    /* the coach speaking louder: a proactive nudge burns amber, not violet.
       --urg (0..1) escalates it as the TTL runs down — mirrors the plugin's
       face(), which brightens the halo and firms the border the same way. */
    .nudgeface { background:
      radial-gradient(circle at 50% 36%,
        hsla(38,90%,calc(58% + var(--urg,0) * 12%),calc(.66 + var(--urg,0) * .33)) 0%,
        hsla(38,90%,45%,.20) 42%, transparent 68%),
      linear-gradient(180deg,#141827,#0a0c13);
      box-shadow: inset 0 0 0 calc(1px + var(--urg,0) * 2px) hsla(38,90%,65%,calc(.3 + var(--urg,0) * .5)); }
    /* the coach ASKING: a linked yes/no pair, magenta so it is neither a
       plain suggestion (violet) nor a nudge (amber) — #34 */
    .qface { background:
      radial-gradient(circle at 50% 36%, hsla(300,78%,58%,.66) 0%, hsla(300,78%,45%,.20) 42%, transparent 68%),
      linear-gradient(180deg,#141827,#0a0c13); }
    .habitface { background:
      radial-gradient(circle at 50% 36%, hsla(var(--hue,222),72%,58%,.62) 0%, transparent 68%),
      linear-gradient(180deg,#141827,#0a0c13); }
    /* Living key faces (#32): streak ring, dim-when-done, count dots. */
    .habitface .ring {
      position: absolute; inset: 5px; border-radius: 14px;
      background: conic-gradient(hsla(var(--hue,222),85%,72%,.95) calc(var(--ring-pct,0)*1%), hsla(var(--hue,222),45%,45%,.18) 0);
      -webkit-mask: radial-gradient(circle, transparent 64%, #000 66%);
              mask: radial-gradient(circle, transparent 64%, #000 66%);
      pointer-events: none;
    }
    .habitface.dim { filter: saturate(.55) brightness(.92); }
    .habitface .check { position: absolute; top: 5px; right: 8px;
      font-size: calc(var(--key) * .10); font-weight: 700; color: hsla(var(--hue,222),80%,80%,.95); }
    .habitface .dots { position: absolute; bottom: 5px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 4px; }
    .habitface .dots span { width: 6px; height: 6px; border-radius: 50%;
      background: hsla(var(--hue,222),45%,45%,.3); }
    .habitface .dots span.on { background: hsla(var(--hue,222),85%,72%,.95); }
    .habitface .count { position: absolute; bottom: 5px; right: 8px;
      font-size: calc(var(--key) * .085); font-weight: 700; color: hsla(var(--hue,222),80%,80%,.95); }
    .emptyface { background:
      radial-gradient(circle at 50% 36%, hsla(222,20%,55%,.35) 0%, transparent 66%),
      linear-gradient(180deg,#12151f,#0a0c13); }
    .emptyface .em, .emptyface .lb { opacity: .55; }

    /* Stream Deck style OK / alert overlay flash — sanctioned: it is painted on
       the key face, not on the page (design/WEB-UX.md §7) */
    .flash {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.55); border-radius: inherit; pointer-events: none;
      font-size: calc(var(--key) * .5); opacity: 0; transition: opacity .15s;
    }
    .flash.show { opacity: 1; }

    /* size/line-height/color come from theme.css .hint — this only centers it
       under the device and caps the measure */
    .hint { margin-top: var(--s5); text-align: center; max-width: 560px; }
    .hint b { color: var(--ink2); font-weight: 600; }

    /* phone: shrink the whole device (device geometry — see :root above) */
    @media (max-width: 760px) { :root { --key: 62px; --gap: 8px; --pad: 14px; } .device { border-radius: 20px; } }
    @media (min-width: 761px) and (max-width: 1000px) { :root { --key: 92px; --gap: 11px; --pad: 20px; } }
  </style>
</head>
<body data-nav="dark">
  <script src="/nav.js" defer></script>
  <div class="top">
    <h1>Virtual Stream Deck</h1>
    <div class="sub">Same keys as the hardware — taps log for real.</div>
  </div>

  <div>
    <div class="device"><div class="face" id="face"></div></div>
    <div class="stand"></div>
  </div>

  <div class="hint" id="hint">Loading keys…</div>

  <script>
    const KEY = new URLSearchParams(location.search).get('key') || '';
    const withKey = (u) => KEY ? u + '&key=' + encodeURIComponent(KEY) : u;
    const face = document.getElementById('face');
    const hint = document.getElementById('hint');
    let slots = [null, null, null, null];
    let habits = [];
    let today = {};   // habitName -> {count, goal, doneToday, streak, ringFill} (#32)
    let built = false;

    // 5x3 grid mirroring the generated MK.2 profile:
    // row 0: habits; row 1: Stats + AI slots 1-4; row 2: unlit.
    function build() {
      face.innerHTML = '';
      habits.forEach((h, i) => {
        const el = keyEl({
          img: '/icons/animated/' + h.name + '.gif',
          title: h.emoji + ' ' + h.label + ' — tap to log, hold to undo, double-tap for a big one',
          onTap: (e2) => tap(e2, '/api/log?hkey=' + (i + 1)),
          onDouble: (e2) => tap(e2, '/api/log?hkey=' + (i + 1) + '&intensity=high'),
          onLong: (e2) => undo(e2, '/api/log?hkey=' + (i + 1))
        });
        el.dataset.habit = i;          // position index, for paintHabits()
        el.dataset.hname = h.name;     // identity for today-state lookup
        // New habits (added via the manager) have no baked icon yet — draw a
        // CSS face with the emoji + label instead of a broken image. (Living
        // key faces repaint these with state too — see paintHabits().)
        el.querySelector('img')?.addEventListener('error', () => {
          el.innerHTML = habitStateHtml(h, today[h.name] || null);
        });
        face.appendChild(el);
      });
      face.appendChild(keyEl({
        img: '/icons/animated/_dashboard.gif',
        title: '📊 Stats — open dashboard',
        onTap: () => { window.open('/', '_blank'); }
      }));
      for (let n = 1; n <= 4; n++) {
        const el = keyEl({
          title: 'AI slot ' + n,
          onTap: (e2) => tap(e2, '/api/log?slot=' + n),
          onDouble: (e2) => tap(e2, '/api/log?slot=' + n + '&intensity=high'),
          // Nudge-ness is decided by the server and can flip between polls, so
          // resolve it at press time, not when the key was built: a hold on a
          // nudge means "not today", on a suggestion it means undo (#35).
          onLong: (e2) => {
            const d = slots[n - 1];
            if (d && d.qid) return dismiss(e2, '/api/question?dismiss=1&slot=' + n, 'Not answering that.');
            if (d && d.nudge) return dismiss(e2, '/api/nudge?dismiss=1&slot=' + n, 'Dismissed — not today.');
            return undo(e2, '/api/log?slot=' + n);
          }
        });
        el.dataset.slot = n;
        face.appendChild(el);
      }
      const used = habits.length + 1 + 4; // habits + stats + AI slots
      for (let i = 0; i < Math.max(0, 15 - used); i++) {
        const off = document.createElement('button');
        off.className = 'k off'; off.disabled = true; off.tabIndex = -1;
        off.innerHTML = '<span class="glass"></span>';
        face.appendChild(off);
      }
      built = true;
      paintSlots();
    }

    // Gesture parity with the physical deck (#33): tap logs, hold undoes,
    // double-tap says "big one". Mirrors streamdeck-plugin/src/gestures.mjs —
    // tests/unit/gestures.test.mjs guards these two copies against drifting.
    const LONG_PRESS_MS = 500, DOUBLE_TAP_MS = 300;

    function bindGestures(b, { onTap, onLong, onDouble }) {
      let longTimer = null, pendingTimer = null, longFired = false;
      const stop = (t) => { if (t) clearTimeout(t); return null; };
      b.addEventListener('pointerdown', () => {
        longFired = false;
        longTimer = stop(longTimer);
        if (!onLong) return;
        longTimer = setTimeout(() => {
          longTimer = null; longFired = true;
          pendingTimer = stop(pendingTimer);   // a hold outranks a waiting tap
          onLong(b);
        }, LONG_PRESS_MS);
      });
      b.addEventListener('pointerup', () => {
        longTimer = stop(longTimer);
        if (longFired) { longFired = false; return; }   // the hold already acted
        if (!onDouble) { onTap && onTap(b); return; }   // no window to wait out
        if (pendingTimer) { pendingTimer = stop(pendingTimer); onDouble(b); return; }
        pendingTimer = setTimeout(() => { pendingTimer = null; onTap && onTap(b); }, DOUBLE_TAP_MS);
      });
      b.addEventListener('pointercancel', () => { longTimer = stop(longTimer); longFired = false; });
      // A touch long-press would otherwise raise the OS context menu on top of
      // the undo we just performed.
      b.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    function keyEl({ img, title, onTap, onLong, onDouble }) {
      const b = document.createElement('button');
      b.className = 'k'; b.title = title || '';
      if (img) b.innerHTML = '<img src="' + img + '" alt="">';
      b.innerHTML += '<span class="glass"></span><span class="flash"></span>';
      bindGestures(b, { onTap, onLong, onDouble });
      return b;
    }

    // Same 0..1 curve as lib/nudge.js nudgeUrgency() — see the drift guard in
    // tests/unit/nudge.test.mjs.
    function urgencyOf(def) {
      if (!def || !def.nudge || !def.expiresAt || !def.assignedAt) return 0;
      const span = def.expiresAt - def.assignedAt;
      if (span <= 0) return 0;
      return Math.max(0, Math.min(1, (Date.now() - def.assignedAt) / span));
    }

    function slotFaceHtml(def, n) {
      if (def) {
        const cls = def.qid ? 'qface' : def.nudge ? 'nudgeface' : 'slotface';
        const badge = def.qid ? '❓ ' + n : def.nudge ? '❗ ' + n : 'AI ' + n;
        const style = def.nudge ? ' style="--urg:' + urgencyOf(def).toFixed(3) + '"' : '';
        return '<span class="facecss ' + cls + '"' + style + '><span class="badge">' + badge + '</span>' +
          '<span class="em">' + esc(def.emoji) + '</span><span class="lb">' + esc(def.label || def.habit) + '</span></span>' +
          '<span class="glass"></span><span class="flash"></span>';
      }
      return '<span class="facecss emptyface"><span class="badge">AI</span>' +
        '<span class="em">✨</span><span class="lb">Slot ' + n + '</span></span>' +
        '<span class="glass"></span><span class="flash"></span>';
    }
    const esc = (s) => String(s).replace(/</g, '&lt;');

    // Same FNV-1a → hue as the plugin (hueFor in app.js) and tools/make-icons:
    // a habit keeps its color for life, across icons and live-rendered faces.
    function hueFor(name) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < name.length; i++) { h ^= name.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      let hue = h % 320; if (hue >= 245) hue += 40; return hue;
    }

    // Living key faces (#32): habit key as a CSS face carrying today's state.
    // Parity with the plugin's canvas face() — streak ring, dim-when-done + ✓,
    // count dots (or a number when goal > 8). The virtual deck swaps a habit's
    // GIF for this face on first repaint so it stays an honest preview of the
    // physical deck (whose canvas faces are static).
    function habitStateHtml(def, st) {
      const hue = hueFor(def.name);
      const done = st && st.doneToday;
      const goal = (st && st.goal) || 1;
      const pct = st ? Math.round((st.ringFill || 0) * 100) : 0;
      let extras = '<span class="ring" style="--ring-pct:' + pct + '"></span>';
      if (done) extras += '<span class="check">✓</span>';
      if (goal > 1 && st && typeof st.count === 'number') {
        if (goal > 8) {
          extras += '<span class="count">' + st.count + '</span>';
        } else {
          let dots = '';
          for (let i = 0; i < goal; i++) dots += '<span class="' + (i < st.count ? 'on' : '') + '"></span>';
          extras += '<span class="dots">' + dots + '</span>';
        }
      }
      return '<span class="facecss habitface ' + (done ? 'dim' : '') + '" style="--hue:' + hue + '">' +
        extras + '<span class="em">' + esc(def.emoji || '•') + '</span>' +
        '<span class="lb">' + esc(def.label || def.name) + '</span></span>' +
        '<span class="glass"></span><span class="flash"></span>';
    }

    function paintHabits() {
      if (!built) return;
      document.querySelectorAll('.k[data-habit]').forEach((el) => {
        const i = +el.dataset.habit;
        const def = habits[i];
        if (!def) return;
        el.innerHTML = habitStateHtml(def, today[def.name] || null);
      });
    }

    function paintSlots() {
      if (!built) return;
      document.querySelectorAll('.k[data-slot]').forEach((el) => {
        const n = +el.dataset.slot;
        const def = slots[n - 1];
        el.innerHTML = slotFaceHtml(def, n);
        el.title = def
          ? (def.qid ? '❓ ' + def.question + '  → ' + def.label : def.emoji + ' ' + def.label + ' — ' + (def.reason || ''))
          : ('AI slot ' + n + ' — empty');
      });
    }

    function flash(el, ok) {
      const f = el.querySelector('.flash');
      if (!f) return;
      f.textContent = ok ? '✅' : '⚠️';
      f.classList.add('show');
      setTimeout(() => f.classList.remove('show'), 900);
    }

    function tap(el, url) {
      el.classList.add('pressed');
      setTimeout(() => el.classList.remove('pressed'), 120);
      fetch(withKey(url))
        .then((r) => {
          flash(el, r.ok);
          if (r.ok) {
            refresh();               // immediate
            setTimeout(refresh, 9000); // catch the coach's reactive repaint
          }
          return r.text();
        })
        .then((t) => { hint.innerHTML = '<b>' + esc(t) + '</b>'; })
        .catch(() => flash(el, false));
    }

    // Long-press "oops": take back today's last log for this key. The 404 the
    // server sends when there is nothing to remove flashes ⚠️ like any other
    // failure — which is the honest answer.
    function undo(el, url) {
      el.classList.add('pressed');
      setTimeout(() => el.classList.remove('pressed'), 120);
      fetch(withKey(url), { method: 'DELETE' })
        .then((r) => {
          flash(el, r.ok);
          if (r.ok) refresh();
          return r.text();
        })
        .then((t) => { hint.innerHTML = '<b>' + esc(t) + '</b>'; })
        .catch(() => flash(el, false));
    }

    // Long-press on a nudge: "not today". Distinct from ignoring it — the
    // scorer records the two differently (#35).
    function dismiss(el, url, msg) {
      el.classList.add('pressed');
      setTimeout(() => el.classList.remove('pressed'), 120);
      fetch(withKey(url), { method: 'POST' })
        .then((r) => {
          flash(el, r.ok);
          if (r.ok) refresh();
          hint.innerHTML = r.ok ? '<b>' + esc(msg) + '</b>' : '<b>Nothing to dismiss.</b>';
        })
        .catch(() => flash(el, false));
    }

    function refresh() {
      // ?tz= lets the server bucket "today" in the viewer's timezone (matches
      // the dashboard), so living key faces read the right day (#32).
      const tz = new Date().getTimezoneOffset(); // minutes; UTC-5 → 300
      fetch('/api/slots?tz=' + tz).then((r) => r.json()).then((j) => {
        habits = j.habits || habits;
        slots = j.slots || slots;
        today = j.today || {};
        if (!built && habits.length) build();
        paintSlots();
        paintHabits();
        if (hint.textContent === 'Loading keys…') {
          hint.innerHTML = 'Tap a key — it logs exactly like the hardware. The <b>✨ AI keys</b> repaint themselves when the coach changes its mind.';
        }
      }).catch(() => { if (!built) hint.textContent = 'Couldn’t reach the API — refresh to retry.'; });
    }

    refresh();
    setInterval(refresh, 15000); // same poll cadence as the hardware plugin
    // A nudge's urgency changes with the clock, not with the payload, so the
    // poll alone would never escalate it. Repaint on its own beat while one is
    // live (the plugin does the same via its tick — see escalate()).
    setInterval(() => { if (slots.some((s) => s && s.nudge)) paintSlots(); }, 20000);
  </script>
</body>
</html>
