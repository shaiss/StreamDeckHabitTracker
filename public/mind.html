<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inside the Coach — Habit Tracker</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    /* Sanctioned exception — design/WEB-UX.md §7.4: the coach's dreamscape.
       Note this RE-BINDS the shared tokens rather than escaping them: every
       niche below still reads var(--card)/var(--line), so the glass look is one
       edit and not forty literals. The page is night-only (data-nav="dark"), so
       there is exactly one value to get right. */
    body {
      --card: rgba(255,255,255,.045);
      --line: rgba(255,255,255,.09);
      min-height: 100vh;
      /* The aurora is illustration, not chrome. The violet stop is exactly
         --violet, so it is expressed as one; the blue and magenta have no token
         on purpose (a magenta token would imply a role it has not earned) and
         stay illustration literals. */
      background:
        radial-gradient(60% 45% at 15% 10%, color-mix(in oklab, var(--violet), transparent 84%), transparent 60%),
        radial-gradient(50% 40% at 85% 20%, rgba(37,99,235,.13), transparent 60%),
        radial-gradient(70% 55% at 50% 100%, rgba(217,70,146,.10), transparent 65%),
        linear-gradient(180deg, #0d0f16 0%, #0a0b11 100%);
    }
    /* the title sits tight against its tagline here — the dashboard's header
       gap would strand it above the fold */
    header { margin-bottom: var(--s1); }
    h1 .spark { filter: drop-shadow(0 0 12px color-mix(in oklab, var(--violet), transparent 20%)); }
    section { margin-top: var(--s6); }

    /* stat tiles — numbers wear ink, not color. auto-FIT rather than the shared
       .grid's auto-fill so four tiles span the full measure instead of leaving
       an empty track. */
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); }
    .tile .n { font-size: 28px; font-weight: 650; letter-spacing: -.02em; }
    .tile .l { color: var(--muted); font-size: 12.5px; margin-top: var(--s1); }

    /* core memories — each orb wears the hue of its own text (§3: hue is
       identity, derived and never chosen) */
    .orbs { display: flex; flex-direction: column; gap: var(--s2); }
    .orb { display: flex; gap: var(--s4); align-items: flex-start; }
    .orb .ball {
      flex: 0 0 26px; height: 26px; margin-top: 1px; border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.95), var(--c) 45%, color-mix(in oklab, var(--c), black 45%) 100%);
      box-shadow: 0 0 14px color-mix(in oklab, var(--c), transparent 45%);
    }
    .orb .t { font-size: 14.5px; line-height: 1.55; color: var(--ink2); }

    /* intuitions — current slot keys, confidence from behavior */
    .ints { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--s3); }
    .int { position: relative; }
    .int .head { display: flex; align-items: center; gap: var(--s2); }
    .int .em { font-size: 24px; filter: drop-shadow(0 0 10px color-mix(in oklab, var(--violet), transparent 50%)); }
    .int .nm { font-weight: 650; font-size: 15px; }
    .int .why { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin-top: var(--s2); }
    .int .conf { margin-top: var(--s3); }

    .note .d { color: var(--muted); font-size: 12px; margin-bottom: var(--s1); }
  </style>
</head>
<body data-nav="dark">
  <script src="/nav.js" defer></script>
  <div class="wrap wide">
    <header>
      <div>
        <h1><span class="spark">✨</span> Inside the Coach</h1>
        <div class="sub" id="tagline">Loading its mind…</div>
      </div>
    </header>

    <section><h2 class="section-h">Growing up</h2><div class="tiles" id="tiles"></div></section>
    <section><h2 class="section-h">Core memories</h2><div class="orbs" id="orbs"><div class="empty">No memories yet — they form as the coach works.</div></div></section>
    <section><h2 class="section-h">Intuitions right now</h2><div class="ints" id="ints"></div></section>
    <section><h2 class="section-h">Last reflection</h2><div id="reflect"><div class="empty">The coach writes a reflection at the end of each day.</div></div></section>
  </div>

  <script>
    const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

    // Hue is identity, derived and never chosen (design/WEB-UX.md §3). Same
    // FNV-1a as tools/lib-hue.mjs — a memory keeps its color for life instead
    // of borrowing the coach's reserved violet from a rotating palette.
    function hueFor(name) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < name.length; i++) { h ^= name.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      let hue = h % 320; if (hue >= 245) hue += 40; return hue;
    }

    fetch('/api/mind').then(r=>r.json()).then(m => {
      if (!m.configured) { document.getElementById('tagline').textContent = 'Storage not connected yet.'; return; }
      const s = m.stats || {};
      document.getElementById('tagline').textContent =
        (m.humanName ? `Learning ${esc(m.humanName)}` : 'Learning its human') +
        ` for ${s.daysTogether} day${s.daysTogether===1?'':'s'} · thinking with ${m.model}`;

      // growth tiles
      const tr = m.track?.overall || { offered: 0, landed: 0, hitRate: 0 };
      document.getElementById('tiles').innerHTML = [
        [s.tapsObserved ?? 0, 'taps observed'],
        [s.ideasTried ?? 0, 'ideas tried'],
        [tr.landed, 'intuitions that landed'],
        [tr.offered ? Math.round(tr.hitRate*100) + '%' : '—', 'intuition hit rate']
      ].map(([n,l]) => `<div class="card tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

      // core memories: the coach's own notes, split into thoughts
      const notes = (m.memory?.notes || '').split(/\n+|(?<=[.!?])\s+(?=[A-Z"“])/).map(t=>t.trim()).filter(t=>t.length>8);
      if (notes.length) {
        document.getElementById('orbs').innerHTML = notes.slice(0, 10).map((t) =>
          `<div class="card orb"><span class="ball" style="--c:hsl(${hueFor(t)},62%,60%)"></span><span class="t">${esc(t)}</span></div>`
        ).join('');
      }

      // intuitions: current slots + behavioral confidence
      const per = Object.fromEntries((m.track?.perHabit||[]).map(r=>[r.habit,r]));
      const conf = (h) => {
        const r = per[h];
        if (!r || r.offered < 1) return 'NEW INTUITION';
        if (r.taps === 0) return 'TESTING · not yet felt';
        if (r.hitRate >= 0.6) return `TRUSTED · landed ${r.landed}/${r.offered}`;
        return `FORMING · landed ${r.landed}/${r.offered}`;
      };
      document.getElementById('ints').innerHTML = (m.slots||[]).map((d,i) => d
        ? `<div class="card int"><div class="head"><span class="em">${d.emoji}</span><span class="nm">${esc(d.label||d.habit)}</span></div>
             <div class="why">${esc(d.reason||'')}</div><div class="tag conf">${conf(d.habit)}</div></div>`
        : `<div class="card int empty">quiet corner ${i+1}</div>`
      ).join('');

      // reflection
      if (m.insight?.text) {
        document.getElementById('reflect').innerHTML =
          `<div class="note"><div class="d">${esc(m.insight.date||'')}</div>${esc(m.insight.text)}</div>`;
      }
    }).catch(() => {
      document.getElementById('tagline').textContent = 'Couldn’t reach the coach — refresh to retry.';
    });
  </script>
</body>
</html>
